name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run bsp:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          RUN_LIVE_API_TESTS: "false"

      - name: Build
        run: npm run build
        env:
          BSP_AUTH_SECRET: ci-bsp-auth-secret-min-32-chars!!
          BSP_ADMIN_PASSWORD: ci-admin-password-secure
          BSP_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Secret scan
        run: npm run secret-scan
